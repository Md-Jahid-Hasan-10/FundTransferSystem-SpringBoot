spring:
  application:
    name: fundtransfer
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/fundtransfer}
    username: ${DB_USERNAME:fund_user}
    password: ${DB_PASSWORD:fund_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: 8080