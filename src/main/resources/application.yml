spring:
  application:
    name: fundtransfer
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/fundtransfer}
    username: ${DB_USERNAME:fund_user}
    password: ${DB_PASSWORD:fund_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: 8080

bank:
  minimum-balance: "100.00"
  per-transaction-limit: "2000.00"
  daily-limit: "3000.00"
  request-expiry-seconds: 300
  currency-symbol: "৳"
  admin-username: admin
  admin-password: admin123
  otp:
    fixed: true
    fixed-value: "123456"
    expiry-seconds: 120
    max-attempts: 3